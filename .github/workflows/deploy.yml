name: Build & Deploy to AWS ECR + EC2

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    outputs:
      # Pass the registry URL (from login response) to the deploy job
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        # outputs: steps.login-ecr.outputs.registry
        # e.g.    123456789.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build, tag & push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          docker tag  "$IMAGE_URI" "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          envs: ECR_REGISTRY,IMAGE_URI,AWS_REGION,NEXT_PUBLIC_SERVER_URL
          script: |
            set -e

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker pull "$IMAGE_URI"

            docker stop ecommerce-app 2>/dev/null || true
            docker rm   ecommerce-app 2>/dev/null || true

            docker run -d \
              --name ecommerce-app \
              --restart unless-stopped \
              -p 4005:4005 \
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_SERVER_URL="$NEXT_PUBLIC_SERVER_URL" \
              "$IMAGE_URI"

            docker image prune -f
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
