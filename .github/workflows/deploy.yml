name: Build & Deploy to AWS ECR + EC2

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    outputs:
      # Pass the registry URL (from login response) to the deploy job
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        # outputs: steps.login-ecr.outputs.registry
        # e.g.    123456789.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build, tag & push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

          docker build \
            --build-arg NEXT_PUBLIC_SERVER_URL="$NEXT_PUBLIC_SERVER_URL" \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          docker tag  "$IMAGE_URI" "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate ECR registry output
        run: |
          ECR_REGISTRY="${{ needs.build-and-push.outputs.registry }}"
          if [ -z "$ECR_REGISTRY" ]; then
            echo "❌ ECR_REGISTRY is empty — build-and-push job did not export registry output."
            exit 1
          fi
          echo "✅ ECR_REGISTRY=$ECR_REGISTRY"

      - name: Prepare Runtime Secrets
        id: prep
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          ENV_B64=$(printf '%s' "${{ secrets.ENV_FILE }}" | base64 -w 0)
          echo "::add-mask::$ENV_B64"
          echo "env_b64=$ENV_B64" >> "$GITHUB_OUTPUT"

          ECR_PASS=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$ECR_PASS"
          echo "ecr_password=$ECR_PASS" >> "$GITHUB_OUTPUT"

      - name: Run Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_PASSWORD: ${{ steps.prep.outputs.ecr_password }}
          ENV_B64: ${{ steps.prep.outputs.env_b64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ECR_PASSWORD,ENV_B64
          script: |
            set -e

            # Guard: fail fast if registry is missing to avoid Docker Hub fallback
            if [ -z "$ECR_REGISTRY" ]; then
              echo "❌ ECR_REGISTRY is empty — aborting to prevent Docker Hub auth error."
              exit 1
            fi

            FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            echo "▶ Deploying image: $FULL_IMAGE"

            # 1. Create .env at runtime on EC2
            if [ -n "$ENV_B64" ]; then
              echo "$ENV_B64" | base64 -d > .env
              chmod 600 .env
            fi

            # 2. Login to ECR and pull image
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$FULL_IMAGE"

            # 3. Stop old container and run new image on port 4005
            docker stop ecommerce-app 2>/dev/null || true
            docker rm   ecommerce-app 2>/dev/null || true

            docker run -d \
              --name ecommerce-app \
              --restart unless-stopped \
              -p 4005:4005 \
              --env-file .env \
              "$FULL_IMAGE"

            # 4. Clean dangling images
            docker image prune -f

            echo "✅ Deployment complete: $FULL_IMAGE"
